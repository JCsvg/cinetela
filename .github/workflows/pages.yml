# Publica a DEMONSTRAÇÃO do front no GitHub Pages a cada push na main.
# Não há API: o front lê frontend/public/demo/dados.json (VITE_DEMO=1).
# Antes do primeiro uso: Settings > Pages > Source: GitHub Actions.
name: Publicar a demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEMO: '1'
          # O site fica em usuario.github.io/NOME-DO-REPO/
          VITE_BASE: /${{ github.event.repository.name }}/
      # O Pages não conhece /filmes/3: devolve o 404.html, que é o próprio app e resolve a rota
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
